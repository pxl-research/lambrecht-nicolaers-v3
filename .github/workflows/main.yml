name: Deployment
on:  
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'
          
      - name: Build for production
        run: |
          npm ci
          npm run build-stage --if-present
      
      - name: Initialize git for plesk
        run: |
          cd dist
          git init
          git config --global user.email "GitHub Actions"
          git config --global user.name "githubactions@github.com"
          git remote add production ${{ secrets.REMOTE_URL }}
          git branch -m main
          git add .
          git commit -m "${{ github.event.head_commit.message }}"
          git push --set-upstream production main --force
